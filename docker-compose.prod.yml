services:
  backend: {build: ., ports: ['3000:3000'], env_file: .env, depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}, opensearch: {condition: service_healthy}}}
  postgres: {image: postgres:16, environment: {POSTGRES_USER: moviebox, POSTGRES_PASSWORD: moviebox, POSTGRES_DB: moviebox}, ports: ['5432:5432'], healthcheck: {test: ['CMD-SHELL','pg_isready -U moviebox -d moviebox'], interval: 5s, timeout: 5s, retries: 20}}
  redis: {image: redis:7-alpine, ports: ['6379:6379'], healthcheck: {test: ['CMD','redis-cli','ping'], interval: 5s, timeout: 5s, retries: 20}}
  opensearch: {image: opensearchproject/opensearch:2, environment: {discovery.type: single-node, DISABLE_SECURITY_PLUGIN: 'true', OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'}, ports: ['9200:9200'], healthcheck: {test: ['CMD-SHELL','curl -fsS http://localhost:9200/_cluster/health'], interval: 10s, timeout: 5s, retries: 30}}
