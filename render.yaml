services:
  - type: web
    name: moviebox-backend
    runtime: node
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: node dist/src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OPENSEARCH_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: FIREBASE_API_KEY
        value: ''
      - key: FIREBASE_AUTH_DOMAIN
        value: ''
      - key: FIREBASE_PROJECT_ID
        value: ''
      - key: FIREBASE_STORAGE_BUCKET
        value: ''
      - key: FIREBASE_MESSAGING_SENDER_ID
        value: ''
      - key: FIREBASE_APP_ID
        value: ''
  - type: worker
    name: moviebox-worker
    runtime: node
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: node dist/src/worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OPENSEARCH_URL
        sync: false
